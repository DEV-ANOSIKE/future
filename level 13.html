<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-md p-[50px] "><!--form container -->
        <h1>Registration Form</h1>

        <form action="#" method="post">
            <fieldset class="border border-1">
                <legend>Personal Information</legend>
                <div>
                    <label>Full Name:</label>
                    <input type="text"  class="border" id="fullname" placeholder="Enter your full name">
                </div>

                <div>
                    <label>Email:</label>
                    <input type="email" class="border" id="email" placeholder="Enter your email">
                </div>

                <div>
                    <label>Password:</label>
                    <input type="password" class="border" id="password" placeholder="Create a password">
                </div>
            </fieldset>



            <fieldset class="border border-1">

                <legend>Additional Information</legend>

                <div>
                    <label>Biography</label>
                    <textarea id="bio" class="border" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div>
                    <label>Country</label>
                    <select id="country" class="border " class="border-2" name="country">
                        <option value="">Select your country</option>
                        <option value="uk">United Kingdom</option>
                        <option value="ca">Canada</option>
                        <option value="au">Australia</option>
                        <option value="other">Other</option>
                    </select>

                </div>

                <div>
                    <label>Gender:</label>

                    <br>

                    <label>Male
                        <input type="radio" class="border" name="Gender" value="male">"Male"
                    </label>

                    <label>
                        <input type="radio" class="border" name="Gender" value="female">"Female"
                    </label>

                    <label>
                        <input type="radio" class="border" name="Gender" value="other">"Other"
                    </label>

                    <label>
                        <input type="radio" class="border" name="Gender" value="prefer not to say">"Prefer not to say"
                    </label>
                </div>

                <div>
                    <label>Interest</label>

                    <br>

                    <label>
                        <input type="checkbox" name="Interest" value="technology"> "Technology"

                        <label>
                            <input type="checkbox" name="Interest" value="sports"> "Sports"
                        </label>

                        <label>
                            <input type="checkbox" name="Interest" value="music"> "Music"
                        </label>

                        <label>
                            <input type="checkbox" name="Interest" value="travel"> "Travel"
                        </label>

                        <label>
                            <input type="checkbox" name="Interest" value="reading"> "Reading"
                        </label>
                </div>

            </fieldset>

            <input type="submit" value="Register">
        </form>
    </div>

</body>

</html>
