<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
 
<body class="bg-gray-300 px-[30px] ">
    <container>
        <header class="py-7 text-3xl font-medium">
            <h1>Button Styling Examples</h1>
        </header>

        <div class="bg-white py-4 rounded-md pl-3">
            <h2 class="font-medium mb-3">Basic Buttons</h2>

            <button class="bg-blue-500 text-white px-4 py-2 hover:bg-blue-700 transition rounded mr-4">Primary Button</button>

            <button class="bg-gray-500 text-white px-4 py-2 hover:bg-gray-900 transition rounded mr-4">Secondary Button</button>

            <button class="bg-green-800 text-white hover:bg-green-400 transition px-4 py-2 rounded mr-4">Success Button</button>

            <button class="bg-red-900 text-white hover:bg-blue-400 transition px-4 py-2 rounded mr-4">Danger Button</button>

        </div>


        <div class="bg-white mt-10 py-4 rounded-md pl-3">

            <h2 class="font-medium  mb-3">Outline Buttons</h2>

            <button class="border border-blue-500 hover:bg-blue-700 transition text-blue-500 border-2 px-4 py-2 rounded mr-4">Outline Button</button>

            <button class="border border-green-700 hover:bg-green-800 transition text-green-500 border-2 px-4 py-2 rounded mr-4">Success Outline</button>

            <button class="border border-red-700 text-red-700 hover:bg-blue-400 transition border-2 px-4 py-2 rounded ">Danger Outline</button>
        </div>


        <div class="bg-white mt-10 py-4 rounded-md pl-3">

            <h2 class="font-medium  mb-3">Link Buttons</h2>
            
            <button class="text-blue-500 underline hover:bg-blue-200 transition mr-4">Link Style Button</button>
            
            <a href="#" class="text-blue-500 underline hover:bg-blue-200 transition">Actual Link Styled as Button</a>

        </div>


        <div class="bg-white mt-10 py-4 rounded-md pl-3">

            <h2 class="font-medium  mb-3">Different Sizes</h2>
            
            <button class="bg-blue-500 text-white hover:bg-blue-700 transition  text-sm px-3 py-1 rounded mr-4">Small Button</button>
            
            <button class="bg-blue-500 text-white hover:bg-blue-700 transition px-4 py-2 rounded mr-4">Normal Button</button>
            
            <button class="bg-blue-500 text-white hover text-lg hover:bg-blue-700 transition px-6 py-3 rounded">Large Button</button>

        </div>


        <div class="bg-white mt-10 py-4 rounded-md pl-3">
            
            <h2 class="font-medium  mb-3">Rounded Buttons</h2>
            
            <button class="bg-blue-500 text-white px-4 hover:bg-blue-700 transition py-2 mr-4 rounded-full">Rounded Primary</button>
            
            <button class="bg-green-800 text-white px-4 hover:bg-green-900 transition py-2 mr-4 rounded-full">Rounded Success</button>
            
            <button class="border border-2 hover:bg-blue-700 transition border-blue-500 text-blue-500 px-4 py-2 rounded-full">Rounded Outline</button>
        </div>
        
        
        
        <div class="bg-white mt-10 py-4 rounded-md pl-3 mb-10">
            
            <h2 class="font-medium  mb-3">Button Group</h2>
            
            
            <button class="bg-blue-500 text-white hover:bg-blue-700 transition px-4 mr-4 py-2 rounded-md px-6">First</button>
            
            <button class="bg-blue-500 text-white px-4 mr-4 py-2 hover:bg-blue-700 transition rounded-md px-7">Second</button>
            
            <button class="bg-blue-500 text-white px-4 py-2 hover:bg-blue-700 transition rounded-md px-6">Third</button>
        </div>



        


    </container>


</body>

</html>
