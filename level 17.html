<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tailwind Hover Effects</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300 min-h-screen flex flex-col items-center gap-10 pt-10 font-sans">


  <div class="w-52 h-52 rounded-xl 
              bg-gradient-to-br from-blue-500 to-purple-600 
              flex items-center justify-center 
              text-white font-semibold
              transition duration-300 ease-in-out animate-bounce
              hover:scale-110 hover:shadow-xl">
    Hover Me!
  </div>


  <button class="px-10 py-4 rounded-full 
                 bg-green-600 text-white font-medium
                 transition duration-300 ease-in-out
                 hover:bg-green-700 hover:-translate-y-1 hover:shadow-lg">
    Hover Button
  </button>

  
  <div class="w-56 h-56 rounded-full 
              bg-red-500 
              flex items-center justify-center 
              text-white font-semibold
              transition duration-500 ease-in-out
              hover:opacity-50">
    Fade on Hover
  </div>

</body>
</html>
